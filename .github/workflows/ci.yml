name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Linux-only: evdev is a Linux-only C extension, so the package won't build
    # or import elsewhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Formatting (black --check)
        run: uv run black --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest
