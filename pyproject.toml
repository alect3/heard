[project]
name = "heard"
version = "0.1.0"
description = "Push-to-talk voice dictation for the Wayland desktop, with herdr-aware on-screen vocabulary bias."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Alec Thomas" }]
dependencies = [
    "evdev>=1.7",
    "httpx>=0.27",
]

[project.scripts]
heard = "heard.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "black>=24"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.black]
target-version = ["py314"]

[tool.ruff]
target-version = "py314"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
